{% extends "main_base.html" %}
{% block title %}Confirm Strava import{% endblock %}
{% block body %}
<div class="container py-5" style="max-width:640px"><div class="card shadow-sm border-0"><div class="card-body p-4"><h2 class="mb-2">Pending Strava activities found</h2><p class="text-muted">There are {{ pending_count }} activities waiting for manual review. Should they be imported when automatic updates are enabled?</p><div class="d-flex flex-wrap gap-2 mt-4"><form method="post" action="{{ url_for('strava.set_auto_update') }}"><input type="hidden" name="enabled" value="1"><input type="hidden" name="confirm_pending" value="1"><input type="hidden" name="import_pending" value="1"><button class="btn btn-success" type="submit">Enable and import them</button></form><form method="post" action="{{ url_for('strava.set_auto_update') }}"><input type="hidden" name="enabled" value="1"><input type="hidden" name="confirm_pending" value="1"><input type="hidden" name="import_pending" value="0"><button class="btn btn-outline-primary" type="submit">Enable, keep pending</button></form><a class="btn btn-outline-secondary" href="{{ url_for('strava.settings') }}">Cancel</a></div></div></div></div>
{% endblock %}
