{% extends "main_base.html" %}
{% block title %}Edit Objective{% endblock %}
{% block body %}
<div class="container py-4" style="max-width:900px"><div class="d-flex justify-content-between align-items-center mb-4"><div><h2 class="mb-1">Edit objective</h2><p class="text-muted mb-0">Planning fields lock after completion; results remain editable.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('season.season_home', year=objective.season.season_year) }}">Back</a></div><form method="post" class="card shadow-sm"><div class="card-body"><div class="row g-3"><div class="col-md-8"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ objective.name }}" required></div><div class="col-md-4"><label class="form-label">Event date{% if objective.status == 'completed' %} (locked){% endif %}</label><input class="form-control" type="date" name="event_date" value="{{ objective.event_date.isoformat() }}" {% if objective.status == 'completed' %}readonly{% endif %} required></div><div class="col-md-4"><label class="form-label">Priority{% if objective.status == 'completed' %} (locked){% endif %}</label><select class="form-select" name="priority" {% if objective.status == 'completed' %}disabled{% endif %}>{% for value in ['A','B','C'] %}<option {% if objective.priority == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Sport</label><select class="form-select" name="sport">{% for value in ['running','cycling','swimming','strength','multisport'] %}<option {% if objective.sport == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status"><option value="planned" {% if objective.status == 'planned' %}selected{% endif %}>Planned</option><option value="completed" {% if objective.status == 'completed' %}selected{% endif %}>Completed</option><option value="cancelled" {% if objective.status == 'cancelled' %}selected{% endif %}>Cancelled</option></select></div><div class="col-md-4"><label class="form-label">Distance (km)</label><input class="form-control" type="number" step="0.1" name="distance_km" value="{{ objective.distance_km or '' }}"></div><div class="col-md-4"><label class="form-label">Elevation (m)</label><input class="form-control" type="number" name="elevation_gain_m" value="{{ objective.elevation_gain_m or '' }}"></div><div class="col-md-4"><label class="form-label">Location</label><input class="form-control" name="location" value="{{ objective.location or '' }}"></div><div class="col-md-4"><label class="form-label">Target time (seconds)</label><input class="form-control" type="number" name="target_time_seconds" value="{{ objective.target_time_seconds or '' }}"></div><div class="col-md-4"><label class="form-label">Target pace</label><input class="form-control" type="number" step="0.01" name="target_pace" value="{{ objective.target_pace or '' }}"></div><div class="col-md-4"><label class="form-label">Target power</label><input class="form-control" type="number" step="0.1" name="target_power" value="{{ objective.target_power or '' }}"></div><div class="col-md-4"><label class="form-label">Result time (seconds)</label><input class="form-control" type="number" name="result_time_seconds" value="{{ objective.result_time_seconds or '' }}"></div><div class="col-md-4"><label class="form-label">Result placing</label><input class="form-control" type="number" min="1" name="result_placing" value="{{ objective.result_placing or '' }}"></div><div class="col-12"><label class="form-label">Notes</label><textarea class="form-control" name="notes" rows="4">{{ objective.notes or '' }}</textarea></div></div><div class="d-flex justify-content-between mt-4"><button class="btn btn-primary" type="submit">Save objective</button>{% if objective.status != 'completed' %}<button class="btn btn-outline-danger" formaction="{{ url_for('season.delete_objective', objective_id=objective.id) }}" formmethod="post" type="submit">Delete</button>{% endif %}</div></div></form></div>
{% endblock %}
