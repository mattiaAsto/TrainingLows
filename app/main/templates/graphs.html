{% extends "main_base.html" %}

{% block body %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0" style="color:#333; font-weight:600;">Graphs & Trends</h2>
        <small class="text-muted">Visualize weekly and monthly trends</small>
    </div>

    <div class="row g-3">

        <div class="col-12 col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Weekly Distance Trend</h5>
                    <div class="chart-container" style="height:260px;">
                        <canvas id="weeklyDistanceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Activity Distribution</h5>
                    <div class="chart-container" style="height:260px;">
                        <canvas id="activityDonutChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Monthly Distance (bar)</h5>
                    <div class="chart-container" style="height:220px;">
                        <canvas id="monthlyBarChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Intensity Distribution</h5>
                    <div class="chart-container" style="height:220px;">
                        <canvas id="intensityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Big ass performance chart</h5>
                    <div class="chart-container" style="height:400px;">
                        <canvas id="intensityChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!--Graphs-->    

    <script>
    // Logic to hightlight navbar link
    const links = document.getElementsByClassName('nav-link');
    const current = links[2];
    current.classList.add('active1');


    // Placeholder: real data should be provided by the view via Jinja
    document.addEventListener('DOMContentLoaded', function(){
        // If Chart.js is loaded by the base template, these canvases can be initialized here.
        // Example placeholder behavior: show friendly message when Chart.js missing.
        if (typeof Chart === 'undefined') {
            document.querySelectorAll('canvas').forEach(function(c){
                var ctx = c.getContext('2d');
                ctx.fillStyle = '#f8f9fa';
                ctx.fillRect(0,0,c.width||300,c.height||150);
                ctx.fillStyle = '#6c757d';
                ctx.font = '14px sans-serif';
                ctx.fillText('Chart placeholder - load Chart.js in base template', 10,20);
            });
        }

        const weekly_distance_data = {{weekly_data|tojson}};

        console.log(weekly_distance_data)

        const ctx = document.getElementById('weeklyDistanceChart').getContext('2d');
        const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: weekly_distance_data.labels,
            datasets: [{
            label: 'Distance (km)',
            data: weekly_distance_data.distances,
            borderColor: '#dc3545',
            backgroundColor: 'rgba(220,53,69,0.1)',
            tension: 0.2,
            fill: true,
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
        });

    });

        

    </script>

{% endblock %}

{% block styles %}
<style>
    :root{ --accent: #dc3545; }
    .chart-container { background: #fff; border-radius:10px; padding:8px; }
    /* placeholder styling for when Chart.js isn't loaded */
    canvas { background: linear-gradient(180deg,#ffffff,#fbfbfb); }
</style>
{% endblock %}
