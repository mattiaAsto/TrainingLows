<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ error.code }} - TrainingLows</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink:#27313d; --muted:#687381; --accent:#dc3545; }
        body { min-height:100vh; margin:0; display:grid; place-items:center; background:linear-gradient(135deg,#f7f8fa,#fff5f3); color:var(--ink); }
        .error-shell { width:min(680px, calc(100% - 2rem)); padding:clamp(2rem,6vw,4.5rem); text-align:center; border:1px solid #e7eaed; border-radius:16px; background:#fff; box-shadow:0 18px 50px rgba(35,45,55,.1); }
        .error-code { color:var(--accent); font-size:clamp(4rem,15vw,8rem); font-weight:800; letter-spacing:-.07em; line-height:1; }
        .error-icon { display:grid; width:64px; height:64px; margin:0 auto 1.25rem; place-items:center; border-radius:50%; background:#fff0f1; color:var(--accent); font-size:1.7rem; }
        .error-shell h1 { margin-bottom:.75rem; font-size:clamp(1.5rem,4vw,2.2rem); }
        .error-message { max-width:480px; margin:0 auto 1.75rem; color:var(--muted); line-height:1.7; }
        .error-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:.65rem; }
        .btn-primary { background:var(--ink); border-color:var(--ink); }
        .btn-primary:hover { background:var(--accent); border-color:var(--accent); }
    </style>
</head>
<body>
    <main class="error-shell" role="alert">
        <div class="error-icon"><i class="fas fa-triangle-exclamation"></i></div>
        <div class="error-code">{{ error.code }}</div>
        <h1>{{ error.title }}</h1>
        <p class="error-message">{{ error.message }}</p>
        <div class="error-actions">
            <a class="btn btn-primary px-4" href="{{ url_for('main.home') }}"><i class="fas fa-house me-2"></i>Go home</a>
            <button class="btn btn-outline-secondary" type="button" onclick="history.back()"><i class="fas fa-arrow-left me-2"></i>Go back</button>
            <a class="btn btn-outline-danger" href="{{ url_for('about.about_home') }}">About TrainingLows</a>
        </div>
    </main>
</body>
</html>
